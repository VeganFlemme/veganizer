# Keeps the Supabase Free project awake (paused after 7 days without activity): one read-only
# request on a public table, twice a week, with the publishable key only (never the secret key).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * 1,4" # Monday and Thursday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row of public.sources
        env:
          SUPABASE_URL: https://vjtayhddemgcydvczunb.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing secret NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >&2
            exit 1
          fi
          status=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/sources?select=id&limit=1")
          echo "HTTP $status"
          test "$status" = "200"
