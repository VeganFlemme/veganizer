name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Public values only. SUPABASE_SECRET_KEY is never used here (pipeline only).
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        # The build prerenders /compare from Supabase: it needs the publishable key.
        if: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' && env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: npm run build
      - name: End-to-end tests (Playwright, against the production build)
        # Suite V1, step 4: journeys at 375, 1 280 and 1 920 px, layout, wording, accessibility.
        if: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' && env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: |
          npx playwright install --with-deps chromium
          npm start -- -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
          BASE_URL=http://localhost:3000 npm run test:e2e -- --reporter=line
      - name: Build skipped
        if: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY == '' || env.NEXT_PUBLIC_SUPABASE_URL == '' }}
        run: echo "::warning::Build skipped — set the repository secret NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY and variable NEXT_PUBLIC_SUPABASE_URL."

  pipeline:
    name: Pipeline parsing rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m unittest discover -s pipeline/tests
